<!-- CABECERA COMPARTIDA -->

<ion-header>

  <ion-toolbar class="barra-principal">

    <!-- LOGOTIPO Y NOMBRE -->
    <ion-title>

      <div class="marca-restaurante">

        <ion-icon name="leaf-outline"></ion-icon>

        <div class="texto-marca">

          <strong>Origen</strong>

          <span>Cocina Venezolana</span>

        </div>

      </div>

    </ion-title>


    <!-- NAVEGACIÓN PARA ORDENADOR -->
    <ion-buttons slot="end" class="menu-escritorio">

      <ion-button
        routerLink="/home"
        routerLinkActive="activo">

        <ion-icon slot="start" name="home-outline"></ion-icon>

        Inicio

      </ion-button>


      <ion-button
        routerLink="/pedidos"
        routerLinkActive="activo">

        <ion-icon slot="start" name="fast-food-outline"></ion-icon>

        Carta / Pedidos

      </ion-button>


      <ion-button
        routerLink="/reservas"
        routerLinkActive="activo">

        <ion-icon slot="start" name="calendar-outline"></ion-icon>

        Reservas

      </ion-button>

    </ion-buttons>


    <!-- MENÚ PARA PANTALLAS PEQUEÑAS -->
    <ion-buttons slot="end" class="menu-movil">

      <ion-button
        id="abrir-menu"
        aria-label="Abrir navegación">

        <ion-icon
          name="menu-outline"
          slot="icon-only">
        </ion-icon>

      </ion-button>

    </ion-buttons>


    <!-- RUEDA DE AJUSTES -->
    <ion-buttons slot="end">

      <ion-button
        id="abrir-ajustes"
        aria-label="Abrir ajustes">

        <ion-icon
          name="settings-outline"
          slot="icon-only">
        </ion-icon>

      </ion-button>

    </ion-buttons>

  </ion-toolbar>

</ion-header>


<!-- MENÚ DE NAVEGACIÓN MÓVIL -->
<ion-popover
  trigger="abrir-menu"
  [dismissOnSelect]="true">

  <ng-template>

    <ion-list lines="none">

      <ion-item button routerLink="/home">
        <ion-icon
          name="home-outline"
          slot="start">
        </ion-icon>

        <ion-label>Inicio</ion-label>
      </ion-item>

      <ion-item button routerLink="/pedidos">
        <ion-icon
          name="fast-food-outline"
          slot="start">
        </ion-icon>

        <ion-label>Pedidos</ion-label>
      </ion-item>

      <ion-item button routerLink="/reservas">
        <ion-icon
          name="calendar-outline"
          slot="start">
        </ion-icon>

        <ion-label>Reservas</ion-label>
      </ion-item>

    </ion-list>

  </ng-template>

</ion-popover>


<!-- MENÚ DE AJUSTES -->
<ion-popover
  trigger="abrir-ajustes"
  side="bottom"
  alignment="end">

  <ng-template>

    <ion-list lines="none">

      <!-- APARIENCIA -->
      <ion-item
        button
        (click)="cambiarTema()">

        <ion-icon
          slot="start"
          [name]="modoOscuro ? 'sunny-outline' : 'moon-outline'">
        </ion-icon>

        <ion-label>
          {{ modoOscuro ? 'Modo claro' : 'Modo oscuro' }}
        </ion-label>

      </ion-item>


      <!-- IDIOMA -->
      <ion-item>

        <ion-icon
          slot="start"
          name="language-outline">
        </ion-icon>

        <ion-select
          label="Idioma"
          label-placement="stacked"
          interface="popover"
          [value]="idioma"
          (ionChange)="cambiarIdioma($event)">

          <ion-select-option value="es">
            Español
          </ion-select-option>

          <ion-select-option value="en">
            English
          </ion-select-option>

        </ion-select>

      </ion-item>


      <!-- PERFIL -->
      <ion-item
        button
        (click)="abrirPerfil()">

        <ion-icon
          slot="start"
          name="person-circle-outline">
        </ion-icon>

        <ion-label>Mi perfil</ion-label>

      </ion-item>

    </ion-list>

  </ng-template>

</ion-popover>
